<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#0d3a30"/>
    <title>SolarFlow Setup</title>
    <style>
        :root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#17352b;background:#f4f7f2}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(520px,100%);background:#fff;border:1px solid #dfe9e1;border-radius:18px;padding:28px;box-shadow:0 10px 40px #173d2912}.mark{width:48px;height:48px;border-radius:14px;background:#e9b949;display:grid;place-items:center;font-size:25px}h1{margin:18px 0 8px;font-size:28px}p{color:#667e72;line-height:1.6;margin:0 0 12px}.note{background:#eef6f2;border:1px solid #d7e9df;border-radius:10px;padding:12px;color:#2c674f;font-size:13px}code{font-size:12px;word-break:break-all}
    </style>
</head>
<body><main class="card"><div class="mark">☀</div><h1>SolarFlow mobile setup</h1><p>The native wrapper is ready, but no server URL was included in this build.</p><div class="note">Sync the app with a secure server URL:<br/><code>SOLARFLOW_MOBILE_URL=https://your-domain.example npm run mobile:sync</code></div></main></body>
</html>
